# 파일 위치: .github/workflows/cds-test.yml
# 시험용(3차): GitHub 서버에서 worldgovernmentbonds.com의 CDS 데이터를 받아
# 그 내용을 "cds-probe"라는 별도 가지에 저장합니다. 사이트(main)에는 영향이 없습니다.
name: CDS 자동 조회 시험

on:
  push:
    paths:
      - ".github/workflows/cds-test.yml"
      - "app/api/cds-probe/route.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 데이터 받아 보기
        run: |
          cat > cds-probe-run.mjs <<'EOF'
          import { mkdirSync, writeFileSync } from "node:fs";
          import { GET } from "./app/api/cds-probe/route.js";

          const esc = (s) => String(s).replace(/%/g, "%25").replace(/\r/g, " ").replace(/\n/g, " ");
          const res = await GET(new Request("http://localhost/api/cds-probe?full=1"));
          const data = await res.json();

          mkdirSync("cds-probe-out", { recursive: true });
          let ok = true;
          for (const key of ["list", "us"]) {
            const d = data[key] || {};
            writeFileSync(`cds-probe-out/${key}-body.txt`, d.body ?? "");
            delete d.body;
            const good = d.postStatus === 200 && d.bodyLength > 200;
            if (!good) ok = false;
            console.log(
              `::notice title=3 wgb ${key} ${good ? "성공" : "실패"}::` +
                esc(`페이지 ${d.pageStatus}, 데이터 응답 ${d.postStatus}, 형식 ${d.contentType}, 글자수 ${d.bodyLength}, JSON ${d.isJson}${d.error ? `, 오류 ${d.error}` : ""}`)
            );
          }
          writeFileSync("cds-probe-out/summary.json", JSON.stringify(data, null, 2));
          process.exit(ok ? 0 : 1);
          EOF
          node cds-probe-run.mjs
      - name: 결과 저장 (cds-probe 가지)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/probe && cp -r cds-probe-out /tmp/probe/ 2>/dev/null || mkdir -p /tmp/probe/cds-probe-out
          cd /tmp/probe
          date -u +"%Y-%m-%dT%H:%M:%SZ" > cds-probe-out/ran-at.txt
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q -b cds-probe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "CDS 시험 결과"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" cds-probe
